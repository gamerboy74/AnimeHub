services:
  # Redis Cache — required for Bull job queue
  redis:
    image: redis:7-alpine
    container_name: animehub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - animehub-network

  # Express Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animehub-server
    ports:
      - "3001:3001"
    env_file:
      - .env                          # Load your real .env for Supabase keys etc.
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      # Redis — uses service hostname "redis" within the docker network
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Scraper tuning
      - SCRAPER_MAX_CONCURRENCY=${SCRAPER_MAX_CONCURRENCY:-2}
      - SCRAPER_BREAKER_THRESHOLD=${SCRAPER_BREAKER_THRESHOLD:-8}
      - SCRAPER_BREAKER_COOLDOWN_MS=${SCRAPER_BREAKER_COOLDOWN_MS:-30000}
      - IN_MEMORY_MAX_ENTRIES=${IN_MEMORY_MAX_ENTRIES:-1000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - animehub-network

volumes:
  redis_data:
    driver: local

networks:
  animehub-network:
    driver: bridge
